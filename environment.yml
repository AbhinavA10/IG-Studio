# Conda environment for running IG Studio from source and building IGStudio.exe.
#   conda env create -f environment.yml
#   conda env update -f environment.yml --prune   (after this file changes)
name: igstudio
channels:
  - conda-forge
  - nodefaults   # Anaconda's "defaults" channel needs registration on some networks
dependencies:
  - python=3.10
  - pillow>=10
  - pyinstaller>=6   # only needed to build IGStudio.exe
